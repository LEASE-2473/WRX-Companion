<div id="emotion-lab">
  <style>
    #emotion-lab { color:var(--foreground); }
    #emotion-lab .space { margin-block:16px; }
    #emotion-lab .assumption { color:var(--purple); }
    #emotion-lab .emotion-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(145px,1fr)); gap:8px; }
    #emotion-lab .emotion-choice { display:grid; gap:4px; text-align:start; }
    #emotion-lab .emotion-choice .progress { width:100%; }
    #emotion-lab .label-row { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    #emotion-lab .section { margin-block:18px; }
    #emotion-lab .chart { width:100%; display:block; height:220px; }
    #emotion-lab .chart text { fill:var(--foreground); font-size:12px; }
    #emotion-lab .swatch { display:inline-block; width:12px; height:3px; margin-inline-end:5px; vertical-align:middle; }
    #emotion-lab .logs { padding-inline-start:20px; }
    #emotion-lab .logs li { margin-block:6px; overflow-wrap:anywhere; }
  </style>
  <div class="viz-row"><h2>情绪实验台</h2><span class="viz-badge">本地模拟 · 无 AI 调用</span><span class="assumption">紫色 ◆ = 可微调的设计假设</span></div>
  <div class="viz-controls space">
    <label class="form-label">情境<select class="form-select" id="el-scene">
      <option value="reunion">久别重逢</option><option value="low">User 很难受</option><option value="conflict">User 生气，Character 沮丧</option><option value="honeymoon">热恋，想一直聊天</option><option value="fight">争执后后悔</option><option value="busy">User 忙碌，想安静</option><option value="play">Character 出去玩回来</option><option value="reassure">User 好多了，给予安慰</option><option value="lonely">分别一整天</option><option value="jealous">吃醋与不安全感</option>
    </select></label><button class="btn" id="el-apply">应用情境</button>
    <button class="btn btn-primary" id="el-step">推进 15 分钟</button><button class="btn" id="el-hour">推进 1 小时</button><button class="btn" id="el-day">推进 24 小时</button>
  </div>
  <div class="viz-row"><strong id="el-clock" class="tabular-nums"></strong><label class="form-check"><input class="form-check-input" type="checkbox" id="el-auto" checked><span class="form-check-label">触发后模拟主动联系与冷却</span></label><button class="btn btn-ghost" id="el-reset">恢复默认实验</button></div>
  <div class="section">
    <h3>主动联系的内心拉扯</h3>
    <div class="viz-controls">
      <label class="form-label assumption">◆ 联系阈值 <output id="el-threshold-label"></output><input class="form-range" id="el-threshold" type="range" min="10" max="100" value="60"></label>
      <label class="form-label assumption">◆ 联系冷却（小时）<input class="form-control" id="el-cooldown" type="number" min="0.25" max="48" step="0.25" value="2"></label>
      <label class="form-label assumption">◆ User 情绪影响倍数<input class="form-control" id="el-userweight" type="number" min="0" max="3" step="0.1" value="1"></label>
      <label class="form-label assumption">◆ Character 退缩影响倍数<input class="form-control" id="el-retreatweight" type="number" min="0" max="3" step="0.1" value="1"></label>
    </div>
    <div class="table-responsive"><table class="table table-sm"><thead><tr><th>动机</th><th>想靠近 +</th><th>想退缩 −</th><th>最终 / 阈值</th></tr></thead><tbody id="el-motives"></tbody></table></div>
    <div id="el-decision" aria-live="polite"></div>
    <details class="space"><summary class="assumption">◆ 查看动机权重与演算约定</summary><table class="table table-sm"><tbody id="el-formulas"></tbody></table><div class="text-small text-muted">0–100 为强度，−5…+5 为变化推动。状态默认持续 2 小时；到期推动归零。回归时长表示无推动时消除 95% 偏离所需时间。模拟行动只减少思念与倾诉冲动，不解除 User 的情绪。所有规则均为体验用假设。</div></details>
  </div>
  <hr>
  <div class="viz-controls space"><label class="form-label">查看对象<select class="form-select" id="el-actor"><option value="char">Character 情绪</option><option value="user">User 情绪（模拟 AI 判断）</option></select></label><span id="el-count" class="text-small"></span></div>
  <div class="card section">
    <div class="viz-row"><h3 id="el-selected"></h3><span id="el-trend" class="viz-badge"></span></div>
    <div class="viz-controls">
      <label class="form-label">当前强度 <output id="el-value-label"></output><input id="el-value" class="form-range" type="range" min="0" max="100"></label>
      <label class="form-label">状态程度 <output id="el-degree-label"></output><input id="el-degree" class="form-range" type="range" min="-5" max="5" step="1"></label>
      <label class="form-label assumption">◆ 常态值<input class="form-control" id="el-base" type="number" min="0" max="100" step="1"></label>
      <label class="form-label assumption">◆ 常规变化 / 小时<input class="form-control" id="el-drift" type="number" min="-20" max="20" step="0.25"></label>
      <label class="form-label assumption">◆ 每级推动 / 小时<input class="form-control" id="el-gain" type="number" min="0" max="30" step="0.25"></label>
      <label class="form-label assumption">◆ 回归常态时长 / 小时<input class="form-control" id="el-recovery" type="number" min="0.25" max="720" step="0.25"></label>
      <label class="form-label assumption">◆ 当前状态剩余 / 小时<input class="form-control" id="el-duration" type="number" min="0" max="72" step="0.25"></label>
    </div>
    <div id="el-change" class="text-small tabular-nums"></div>
  </div>
  <div class="section"><div class="viz-row"><h3 id="el-chart-label">情绪轨迹</h3><span><span class="swatch" style="background:var(--viz-series-1)"></span>Character</span><span><span class="swatch" style="background:var(--viz-series-2)"></span>User</span></div><svg class="chart" id="el-chart" role="img" aria-label="所选情绪随模拟时间的强度变化"></svg></div>
  <div id="el-emotions"></div>
  <details class="section" open><summary>最近状态变化与模拟行动</summary><ol id="el-log" class="logs text-small"></ol></details>
</div>
<script>
(() => {
  const root = document.getElementById('emotion-lab');
  const $ = id => root.querySelector('#el-' + id);
  const clamp = x => Math.max(0, Math.min(100, x));
  // name, baseline, 95%-recovery hours, per-level hourly influence, constant hourly drift.
  const groups = [
    ['关系与依恋', [['亲近',65,168,1,0],['爱意',60,240,1,0],['信任',65,240,1,0],['依恋',45,72,2,0],['思念',20,12,4,2],['孤独',10,8,4,0],['嫉妒',5,6,4,0],['占有欲',15,24,2,0],['安全感',65,24,3,0],['被理解感',55,12,3,0],['疏离',5,12,3,0],['感激',20,24,2,0]]],
    ['喜悦与探索', [['喜悦',35,6,5,0],['兴奋',20,3,6,0],['满足',40,12,3,0],['期待',25,12,3,0],['希望',50,24,2,0],['好奇',40,12,3,0],['兴趣',35,12,3,0],['惊讶',5,1,8,0],['自豪',20,24,2,0],['敬佩',20,24,2,0],['敬畏',5,6,3,0],['怀念',15,24,2,0]]],
    ['担忧与压力', [['担忧',10,6,5,0],['焦虑',10,4,5,0],['恐惧',5,3,6,0],['不安',10,6,4,0],['紧张',10,3,5,0],['压力',15,8,4,0],['无助',5,6,4,0],['内疚',5,12,3,0],['悔恨',5,24,2,0],['羞耻',5,12,3,0],['尴尬',5,2,5,0]]],
    ['愤怒与防御', [['生气',5,4,5,0],['烦躁',10,3,5,0],['怨恨',5,48,2,0],['委屈',5,12,3,0],['受伤',5,24,3,0],['挫败',10,8,4,0],['厌恶',5,8,4,0],['失望',10,24,3,0],['防备',10,24,2,0]]],
    ['低落与退缩', [['悲伤',10,12,3,0],['沮丧',10,8,4,0],['失落',10,12,3,0],['空虚',10,12,3,0],['无聊',15,6,4,0],['冷漠',5,24,2,0],['退缩',5,8,4,0],['犹豫',10,4,4,0]]],
    ['身心与欲望', [['精力',65,8,4,0],['疲惫',20,8,4,0],['困倦',15,4,5,0],['平静',55,6,4,0],['放松',45,6,4,0],['陪伴欲',40,12,3,0],['倾诉欲',25,6,4,0],['探索欲',35,12,3,0],['亲昵欲',35,12,3,0],['食欲',30,4,3,0],['亲密欲',25,12,3,0]]]
  ];
  const defs = groups.flatMap(([group, list]) => list.map(([name, base, recovery, gain, drift]) => ({group,name,base,recovery,gain,drift})));
  const names = defs.map(d=>d.name);
  const initial = actor => Object.fromEntries(defs.map(d => [d.name,{v:actor==='user' && ['爱意','亲近','信任'].includes(d.name)?50:d.base,b:d.base,h:d.recovery,g:d.gain,r:d.drift,d:0,end:0}]));
  let S = {version:1,t:0,char:initial('char'),user:initial('user'),actor:'char',selected:'思念',threshold:60,cooldown:2,uw:1,rw:1,lastAction:-1000,auto:true,actions:0,quietUntil:0,log:[]};
  let history=[];
  const fmt = v => Number(v).toFixed(1);
  const sign = v => v>0?'+'+fmt(v):fmt(v);
  const level = d => d===0?'趋稳':(['微弱','缓慢','明显','快速','急剧'][Math.abs(d)-1]+(d>0?'上升':'下降'));
  function snapshot() { const row={t:S.t,char:names.map(n=>S.char[n].v),user:names.map(n=>S.user[n].v)}; if(history.length && history.at(-1).t===S.t) history[history.length-1]=row;else history.push(row);if(history.length>300)history.shift(); }
  function log(text) {S.log.unshift(`+${fmt(S.t)}h · ${text}`);S.log=S.log.slice(0,16);}
  function get(a,n){return S[a][n].v;}
  function motives(){
    const c=n=>get('char',n),u=n=>get('user',n);
    const reluctance=S.rw*(.25*c('悲伤')+.3*c('退缩')+.2*c('生气')+.15*c('疲惫'));
    return [
      {name:'靠近 / 陪聊',plus:.45*c('思念')+.25*c('依恋')+.2*c('陪伴欲')+.15*c('爱意')+.1*c('亲昵欲'),minus:reluctance+.3*c('疏离')},
      {name:'安抚 / 关心',plus:S.uw*(.4*u('生气')+.45*u('悲伤')+.3*u('焦虑')+.2*u('委屈'))+.35*c('担忧')+.15*c('爱意'),minus:reluctance+.15*c('防备')},
      {name:'修复 / 道歉',plus:.5*c('悔恨')+.35*c('内疚')+.2*c('爱意')+.15*S.uw*u('受伤'),minus:S.rw*(.4*c('生气')+.3*c('防备')+.2*c('羞耻'))},
      {name:'分享 / 探索',plus:.35*c('喜悦')+.3*c('兴奋')+.25*c('倾诉欲')+.2*c('探索欲')+.15*c('好奇'),minus:S.rw*(.3*c('疲惫')+.3*c('退缩')+.2*c('悲伤'))}
    ].map(m=>({...m,score:clamp(m.plus-m.minus)}));
  }
  function strongest(){return motives().reduce((a,b)=>a.score>b.score?a:b);}
  function event(a,n,value,degree,h=2){Object.assign(S[a][n],{v:clamp(value),d:degree,end:S.t+h});}
  function applyScene(scene){
    const e=event;
    const scenes={
      reunion:()=>{e('char','思念',65,-2);e('char','喜悦',75,3);e('char','爱意',75,2);e('char','亲近',78,1);e('user','喜悦',70,2);},
      low:()=>{e('user','悲伤',85,2,4);e('user','无助',65,2,4);e('char','担忧',65,3,4);e('char','陪伴欲',65,2,4);},
      conflict:()=>{e('user','生气',90,3,4);e('user','委屈',70,2,4);e('char','沮丧',85,2,4);e('char','悲伤',80,2,4);e('char','退缩',85,3,4);e('char','担忧',50,2,4);},
      honeymoon:()=>{e('char','爱意',90,2,8);e('char','依恋',90,2,8);e('char','思念',60,3,8);e('char','陪伴欲',90,2,8);e('char','亲昵欲',85,2,8);},
      fight:()=>{e('char','生气',60,-3,4);e('char','悔恨',85,2,4);e('char','内疚',75,2,4);e('char','防备',40,-2,4);e('user','受伤',65,1,4);},
      busy:()=>{S.quietUntil=S.t+4;e('user','压力',70,2,4);e('user','疲惫',60,2,4);e('char','思念',60,2,4);},
      play:()=>{e('char','喜悦',85,2,3);e('char','兴奋',80,2,3);e('char','探索欲',80,2,3);e('char','倾诉欲',90,3,3);e('char','疲惫',40,1,3);},
      reassure:()=>{e('user','悲伤',25,-3);e('user','生气',15,-3);e('user','焦虑',20,-3);e('char','担忧',25,-3);e('char','安全感',85,2);e('char','退缩',20,-3);e('char','悲伤',25,-2);},
      lonely:()=>{e('char','思念',85,2,6);e('char','孤独',70,2,6);e('char','陪伴欲',75,2,6);},
      jealous:()=>{e('char','嫉妒',75,2,4);e('char','不安',70,2,4);e('char','占有欲',65,2,4);e('char','安全感',25,-2,4);e('char','担忧',50,1,4);}
    };
    scenes[scene]();log('情境：'+$('scene').selectedOptions[0].textContent+'（预设情绪冲击与状态）');snapshot();render();save();
  }
  function step(hours){
    const stop=S.t+hours;
    while(S.t<stop-1e-8){
      let dt=Math.min(1/12,stop-S.t);
      for(const a of ['char','user'])for(const n of names){const x=S[a][n];if(x.d && x.end>S.t && x.end<S.t+dt)dt=x.end-S.t;}
      const before=strongest().score;
      for(const a of ['char','user'])for(const n of names){const x=S[a][n];if(x.end<=S.t+1e-8)x.d=0;const k=3/x.h,drive=x.r+x.g*x.d;const target=x.b+drive/k;x.v=clamp(target+(x.v-target)*Math.exp(-k*dt));}
      S.t+=dt;
      for(const a of ['char','user'])for(const n of names){const x=S[a][n];if(x.end<=S.t+1e-8)x.d=0;}
      const best=strongest();
      if(S.auto && best.score>=S.threshold && S.t-S.lastAction>=S.cooldown && S.t>=S.quietUntil){
        S.lastAction=S.t;S.actions++;log('模拟唤醒：'+best.name+'，行动值 '+fmt(best.score)+'；思念与倾诉欲减少 25，进入冷却');
        for(const n of ['思念','倾诉欲']) S.char[n].v=clamp(S.char[n].v-25);
        snapshot();
      }else if(before<S.threshold && best.score>=S.threshold)log('动机越过阈值：'+best.name+' '+fmt(best.score));
      snapshot();
    }
    log('推进 '+fmt(hours)+' 小时');render();save();
  }
  function editor(){
    const x=S[S.actor][S.selected];$('selected').textContent=(S.actor==='char'?'Character':'User')+' · '+S.selected;
    $('trend').textContent=level(x.d)+' '+(x.d>0?'+':'')+x.d;
    for(const [id,key] of [['value','v'],['degree','d'],['base','b'],['drift','r'],['gain','g'],['recovery','h']])$(id).value=x[key];
    $('duration').value=Math.max(0,x.end-S.t).toFixed(2);$('value-label').textContent=fmt(x.v);$('degree-label').textContent=(x.d>0?'+':'')+x.d;
    const natural=3/x.h*(x.b-x.v),drive=x.d*x.g;
    $('change').textContent=`当前每小时：常规 ${sign(x.r)} + 状态 ${sign(drive)} + 回归 ${sign(natural)} = ${sign(x.r+drive+natural)}；推动归零后向常态回归`;
  }
  function render(){
    $('clock').textContent=`模拟时间 +${fmt(S.t)} 小时 · 已唤醒 ${S.actions} 次`;
    $('threshold-label').textContent=S.threshold;$('threshold').value=S.threshold;$('cooldown').value=S.cooldown;$('userweight').value=S.uw;$('retreatweight').value=S.rw;$('auto').checked=S.auto;$('actor').value=S.actor;
    $('count').textContent=`每个对象 ${defs.length} 个变量 · 强度 0–100`;
    $('motives').replaceChildren();
    for(const m of motives()) {const tr=document.createElement('tr');for(const v of [m.name,'+'+fmt(m.plus),'−'+fmt(m.minus),fmt(m.score)+' / '+S.threshold]){const td=document.createElement('td');td.textContent=v;td.className='tabular-nums';tr.append(td);}$('motives').append(tr);}
    const best=strongest(),left=Math.max(0,S.cooldown-(S.t-S.lastAction));
    $('decision').textContent=S.t<S.quietUntil?`User 希望安静：剩余 ${fmt(S.quietUntil-S.t)} 小时，暂停主动联系` : left>0?`联系冷却中：剩余 ${fmt(left)} 小时；当前最强动机 ${best.name} ${fmt(best.score)}`:best.score>=S.threshold?`已达到唤醒条件：${best.name} ${fmt(best.score)}（推进时间后模拟判断）`:`暂不唤醒：${best.name} ${fmt(best.score)}，还差 ${fmt(S.threshold-best.score)}`;
    $('emotions').replaceChildren();
    for(const [group,list]of groups){const section=document.createElement('section');section.className='section';const heading=document.createElement('h3');heading.textContent=group;const grid=document.createElement('div');grid.className='emotion-grid';
      for(const [name]of list){const x=S[S.actor][name],button=document.createElement('button');button.type='button';button.className='btn emotion-choice';button.setAttribute('aria-pressed',String(S.selected===name));button.setAttribute('aria-label',`${name} ${fmt(x.v)}，${level(x.d)} ${x.d}，点击微调`);const row=document.createElement('span');row.className='label-row';const label=document.createElement('span');label.textContent=name;const val=document.createElement('span');val.className='tabular-nums';val.textContent=fmt(x.v);row.append(label,val);const track=document.createElement('span');track.className='progress';track.setAttribute('aria-hidden','true');const bar=document.createElement('span');bar.className='progress-bar';bar.style.width=x.v+'%';bar.style.background='var(--viz-series-1)';track.append(bar);const trend=document.createElement('span');trend.className='text-small';trend.textContent=level(x.d)+(x.d?' '+(x.d>0?'+':'')+x.d:'');button.append(row,track,trend);button.onclick=()=>{S.selected=name;render();save();};grid.append(button);}
      section.append(heading,grid);$('emotions').append(section);
    }
    editor();draw();$('log').replaceChildren();for(const text of S.log){const li=document.createElement('li');li.textContent=text;$('log').append(li);}
  }
  function draw(){
    const svg=$('chart'),w=Math.max(280,svg.getBoundingClientRect().width||600),h=220,left=48,right=20,top=15,bottom=44;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();
    const add=(tag,attrs,text)=>{const el=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.append(el);return el;};
    const start=history.length?history[0].t:0,end=Math.max(start+1,S.t),X=t=>left+(t-start)/(end-start)*(w-left-right),Y=v=>top+(100-v)/100*(h-top-bottom);
    for(const v of [0,50,100]){add('line',{x1:left,y1:Y(v),x2:w-right,y2:Y(v),stroke:'var(--border)'});add('text',{x:left-8,y:Y(v)+4,'text-anchor':'end'},v);}
    for(const t of [start,(start+end)/2,end])add('text',{x:X(t),y:h-bottom+20,'text-anchor':t===start?'start':t===end?'end':'middle'},fmt(t));
    add('text',{x:left,y:h-4,'data-axis':'x'},'模拟时间（小时）');add('text',{x:4,y:12,'data-axis':'y'},'强度');
    const idx=names.indexOf(S.selected);
    for(const [a,color]of [['char','var(--viz-series-1)'],['user','var(--viz-series-2)']]){const rows=history.length?history:[{t:0,[a]:names.map(n=>S[a][n].v)}];add('polyline',{points:rows.map(r=>`${X(r.t)},${Y(r[a][idx])}`).join(' '),fill:'none',stroke:color,'stroke-width':2});add('circle',{cx:X(rows.at(-1).t),cy:Y(rows.at(-1)[a][idx]),r:3,fill:color,'data-tooltip':`${a==='char'?'Character':'User'} ${S.selected} ${fmt(rows.at(-1)[a][idx])}`});}
    $('chart-label').textContent=S.selected+' · 情绪轨迹';svg.setAttribute('aria-label',`${S.selected}，Character ${fmt(S.char[S.selected].v)}，User ${fmt(S.user[S.selected].v)}，从 ${fmt(start)} 到 ${fmt(end)} 小时`);
  }
  function save(){
    const packed=a=>names.map(n=>{const x=S[a][n];return [x.v,x.b,x.h,x.g,x.r,x.d,x.end].map(v=>Math.round(v*1000)/1000);});
    const privateContent={version:1,t:S.t,actor:S.actor,selected:S.selected,threshold:S.threshold,cooldown:S.cooldown,uw:S.uw,rw:S.rw,lastAction:S.lastAction,auto:S.auto,actions:S.actions,quietUntil:S.quietUntil,log:S.log,char:packed('char'),user:packed('user')};
    if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{simulatedHours:S.t,selectedEmotion:S.selected,actor:S.actor,threshold:S.threshold,actions:S.actions,motives:motives(),recentEvents:S.log.slice(0,4)},privateContent}).catch(()=>{});
  }
  function restore(saved){const p=saved?.privateContent;if(p?.version!==1||!Array.isArray(p.char)||p.char.length!==names.length||!Array.isArray(p.user)||p.user.length!==names.length)return;for(const a of ['char','user'])for(let i=0;i<names.length;i++){const row=p[a][i];if(!Array.isArray(row)||row.length!==7||!row.every(Number.isFinite))return;}
    for(const key of ['t','actor','selected','threshold','cooldown','uw','rw','lastAction','auto','actions','quietUntil','log'])if(p[key]!==undefined)S[key]=p[key];
    if(!['char','user'].includes(S.actor))S.actor='char';if(!names.includes(S.selected))S.selected='思念';
    for(const a of ['char','user'])names.forEach((n,i)=>{const [v,b,h,g,r,d,end]=p[a][i];S[a][n]={v:clamp(v),b:clamp(b),h:Math.max(.25,h),g,r,d:Math.max(-5,Math.min(5,Math.round(d))),end};});history=[];snapshot();}
  $('apply').onclick=()=>applyScene($('scene').value);$('step').onclick=()=>step(.25);$('hour').onclick=()=>step(1);$('day').onclick=()=>step(24);
  $('actor').onchange=()=>{S.actor=$('actor').value;render();save();};$('auto').onchange=()=>{S.auto=$('auto').checked;render();save();};
  for(const [id,key]of [['threshold','threshold'],['cooldown','cooldown'],['userweight','uw'],['retreatweight','rw']])$(id).onchange=()=>{const el=$(id);if(!el.validity.valid||!Number.isFinite(el.valueAsNumber))return;S[key]=el.valueAsNumber;log('参数 '+id+' → '+S[key]);render();save();};
  for(const [id,key]of [['value','v'],['degree','d'],['base','b'],['drift','r'],['gain','g'],['recovery','h'],['duration','end']])$(id).onchange=()=>{const el=$(id);if(!el.validity.valid||!Number.isFinite(el.valueAsNumber))return;const x=S[S.actor][S.selected];x[key]=id==='duration'?S.t+el.valueAsNumber:el.valueAsNumber;if(id==='degree'&&x.end<=S.t)x.end=S.t+2;log(`${S.actor==='char'?'Character':'User'} ${S.selected} ${id} → ${el.valueAsNumber}`);snapshot();render();save();};
  $('reset').onclick=()=>{S={version:1,t:0,char:initial('char'),user:initial('user'),actor:'char',selected:'思念',threshold:60,cooldown:2,uw:1,rw:1,lastAction:-1000,auto:true,actions:0,quietUntil:0,log:[]};history=[];snapshot();render();save();};
  const equations=[['靠近 / 陪聊','+.45 思念 +.25 依恋 +.20 陪伴欲 +.15 爱意 +.10 亲昵欲；−退缩合力 −.30 疏离'],['安抚 / 关心','User 倍数 × (.40 生气 +.45 悲伤 +.30 焦虑 +.20 委屈) +.35 担忧 +.15 爱意；−退缩合力 −.15 防备'],['修复 / 道歉','+.50 悔恨 +.35 内疚 +.20 爱意 +.15 User 倍数 × User 受伤；−退缩倍数 × (.40 生气 +.30 防备 +.20 羞耻)'],['分享 / 探索','+.35 喜悦 +.30 兴奋 +.25 倾诉欲 +.20 探索欲 +.15 好奇；−退缩倍数 × (.30 疲惫 +.30 退缩 +.20 悲伤)'],['退缩合力','Character 退缩倍数 × (.25 悲伤 +.30 退缩 +.20 生气 +.15 疲惫)'],['情绪更新','每小时变化 = 常规变化 + 每级推动 × 程度 + 3 / 回归时长 × (常态 − 当前强度)；使用指数解，限制在 0–100'],['常态恢复','0 程度、0 常规变化时，在指定回归时长内消除约 95% 偏离；常规变化不为 0 时平衡点会偏移'],['模拟联系','最强动机 ≥ 阈值且冷却、安静期结束 → 模拟一次唤醒；并不意味着真实 LLM 必须发消息']];
  for(const [name,text]of equations){const tr=document.createElement('tr');for(const value of [name,text]){const td=document.createElement('td');td.textContent=value;tr.append(td);}$('formulas').append(tr);}
  restore(window.openai?.widgetState);if(!history.length)snapshot();render();new ResizeObserver(draw).observe($('chart'));
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);render();}});
  window.emotionLabTest={step,motives,applyScene,getState:()=>S,getDefinitions:()=>defs};
})();
</script>
