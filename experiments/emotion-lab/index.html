        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

      &lt;div class=&quot;formula-line&quot;&gt;① 强度 x：现在有多强（0–100）。程度 d：正在上升或下降（−5…+5）。两者独立。&lt;/div&gt;
      &lt;div class=&quot;formula-line&quot;&gt;② 每小时变化 = 常规变化 r + 每级推动 g × 程度 d + (3 ÷ 回归时长 H) × (常态 b − 当前 x)。&lt;/div&gt;
      &lt;div class=&quot;formula-line&quot;&gt;③ 例：担忧 x=65、b=10、d=+2、g=5、H=6、r=0。状态推动 +10，回归 −27.5，净变化 −17.5 / 小时。上升状态只是正向推动，最终强度仍可能下降。&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;emotion-lab&#x27;);
  const $ = id =&gt; root.querySelector(&#x27;#el-&#x27; + id);
  const clamp = x =&gt; Math.max(0, Math.min(100, x));
  // name, baseline, 95%-recovery hours, per-level hourly influence, constant hourly drift.
  const groups = [
    [&#x27;关系与依恋&#x27;, [[&#x27;亲近&#x27;,65,168,1,0],[&#x27;爱意&#x27;,60,240,1,0],[&#x27;信任&#x27;,65,240,1,0],[&#x27;依恋&#x27;,45,72,2,0],[&#x27;思念&#x27;,20,12,4,2],[&#x27;疏离&#x27;,5,12,3,0]]],
    [&#x27;喜悦与探索&#x27;, [[&#x27;喜悦&#x27;,35,6,5,0],[&#x27;兴奋&#x27;,20,3,6,0],[&#x27;满足&#x27;,40,12,3,0],[&#x27;期待&#x27;,25,12,3,0],[&#x27;希望&#x27;,50,24,2,0],[&#x27;好奇&#x27;,40,12,3,0]]],
    [&#x27;担忧与压力&#x27;, [[&#x27;担忧&#x27;,10,6,5,0],[&#x27;焦虑&#x27;,10,4,5,0],[&#x27;恐惧&#x27;,5,3,6,0],[&#x27;不安&#x27;,10,6,4,0],[&#x27;压力&#x27;,15,8,4,0],[&#x27;内疚&#x27;,5,12,3,0]]],
    [&#x27;愤怒与防御&#x27;, [[&#x27;生气&#x27;,5,4,5,0],[&#x27;委屈&#x27;,5,12,3,0],[&#x27;受伤&#x27;,5,24,3,0],[&#x27;防备&#x27;,10,24,2,0],[&#x27;悔恨&#x27;,5,24,2,0],[&#x27;嫉妒&#x27;,5,6,4,0]]],
    [&#x27;低落与退缩&#x27;, [[&#x27;悲伤&#x27;,10,12,3,0],[&#x27;沮丧&#x27;,10,8,4,0],[&#x27;退缩&#x27;,5,8,4,0],[&#x27;孤独&#x27;,10,8,4,0],[&#x27;空虚&#x27;,10,12,3,0],[&#x27;无聊&#x27;,15,6,4,0]]],
    [&#x27;身心与欲望&#x27;, [[&#x27;精力&#x27;,65,8,4,0],[&#x27;疲惫&#x27;,20,8,4,0],[&#x27;陪伴欲&#x27;,40,12,3,0],[&#x27;倾诉欲&#x27;,25,6,4,0],[&#x27;探索欲&#x27;,35,12,3,0],[&#x27;亲昵欲&#x27;,35,12,3,0]]]
  ];
  const defs = groups.flatMap(([group, list]) =&gt; list.map(([name, base, recovery, gain, drift]) =&gt; ({group,name,base,recovery,gain,drift})));
  const names = defs.map(d=&gt;d.name);
  const initial = actor =&gt; Object.fromEntries(defs.map(d =&gt; [d.name,{v:actor===&#x27;user&#x27; ? (d.name===&#x27;精力&#x27;?65:d.name===&#x27;疲惫&#x27;?20:0) : d.base,b:d.base,h:d.recovery,g:d.gain,r:d.drift,d:0,end:0}]));
  let S = {version:2,t:0,char:initial(&#x27;char&#x27;),user:initial(&#x27;user&#x27;),actor:&#x27;char&#x27;,selected:&#x27;思念&#x27;,threshold:60,cooldown:2,uw:1,rw:1,lastAction:-1000,auto:true,userDecay:false,actions:0,quietUntil:0,log:[]};
  let history=[];
  const fmt = v =&gt; Number(v).toFixed(1);
  const sign = v =&gt; v&gt;0?&#x27;+&#x27;+fmt(v):fmt(v);
  const level = d =&gt; d===0?&#x27;趋稳&#x27;:([&#x27;微弱&#x27;,&#x27;缓慢&#x27;,&#x27;明显&#x27;,&#x27;快速&#x27;,&#x27;急剧&#x27;][Math.abs(d)-1]+(d&gt;0?&#x27;上升&#x27;:&#x27;下降&#x27;));
  function snapshot() { const row={t:S.t,char:names.map(n=&gt;S.char[n].v),user:names.map(n=&gt;S.user[n].v)}; if(history.length &amp;&amp; history.at(-1).t===S.t) history[history.length-1]=row;else history.push(row);if(history.length&gt;300)history.shift(); }
  function log(text) {S.log.unshift(`+${fmt(S.t)}h · ${text}`);S.log=S.log.slice(0,16);}
  function get(a,n){return S[a][n].v;}
  function motives(){
    const c=n=&gt;get(&#x27;char&#x27;,n),u=n=&gt;get(&#x27;user&#x27;,n);
    const reluctance=S.rw*(.25*c(&#x27;悲伤&#x27;)+.3*c(&#x27;退缩&#x27;)+.2*c(&#x27;生气&#x27;)+.15*c(&#x27;疲惫&#x27;));
    return [
      {name:&#x27;靠近 / 陪聊&#x27;,plus:.45*c(&#x27;思念&#x27;)+.25*c(&#x27;依恋&#x27;)+.2*c(&#x27;陪伴欲&#x27;)+.15*c(&#x27;爱意&#x27;)+.1*c(&#x27;亲昵欲&#x27;),minus:reluctance+.3*c(&#x27;疏离&#x27;)},
      {name:&#x27;安抚 / 关心&#x27;,plus:S.uw*(.4*u(&#x27;生气&#x27;)+.45*u(&#x27;悲伤&#x27;)+.3*u(&#x27;焦虑&#x27;)+.2*u(&#x27;委屈&#x27;))+.35*c(&#x27;担忧&#x27;)+.15*c(&#x27;爱意&#x27;),minus:reluctance+.15*c(&#x27;防备&#x27;)},
      {name:&#x27;修复 / 道歉&#x27;,plus:.5*c(&#x27;悔恨&#x27;)+.35*c(&#x27;内疚&#x27;)+.2*c(&#x27;爱意&#x27;)+.15*S.uw*u(&#x27;受伤&#x27;),minus:S.rw*(.4*c(&#x27;生气&#x27;)+.3*c(&#x27;防备&#x27;)+.2*c(&#x27;委屈&#x27;))},
      {name:&#x27;分享 / 探索&#x27;,plus:.35*c(&#x27;喜悦&#x27;)+.3*c(&#x27;兴奋&#x27;)+.25*c(&#x27;倾诉欲&#x27;)+.2*c(&#x27;探索欲&#x27;)+.15*c(&#x27;好奇&#x27;),minus:S.rw*(.3*c(&#x27;疲惫&#x27;)+.3*c(&#x27;退缩&#x27;)+.2*c(&#x27;悲伤&#x27;))}
    ].map(m=&gt;({...m,score:clamp(m.plus-m.minus)}));
  }
  function strongest(){return motives().reduce((a,b)=&gt;a.score&gt;b.score?a:b);}
  function event(a,n,value,degree,h=2){if(a===&#x27;user&#x27;&amp;&amp;!$(&#x27;sampleuser&#x27;).checked)return;Object.assign(S[a][n],{v:clamp(value),d:degree,end:S.t+h});}
  function applyScene(scene){
